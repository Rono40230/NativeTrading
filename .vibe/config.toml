# 🧠 VIBE CONFIGURATION - NATIVE TRADING AI
# Contrôle le comportement de l'environnement de développement IA
# Référence : .clinerules pour règles métier

[project]
name = "Native Trading AI"
# Stack supportée: "rust", "vue"
stack = ["rust", "vue"]
# Aucune langue imposée pour le nommage (fr/en libre)
language = "agnostic"

[sentinel]
# Fréquence de vérification (secondes)
# AUGMENTÉ POUR ÉVITER LA SURCHARGE VSCODE
watch_interval = 5
timeout = 3

# Fichiers à surveiller pour le checksum
watch_extensions = ["rs", "vue", "ts", "js", "toml", "json", "sql"]

# Fichiers/dossiers à ignorer
ignore_paths = [
    "target",           # Rust build output
    "node_modules",     # npm dependencies  
    "dist",             # Vue build output
    ".git",             # Version control
    ".vibe",            # Vibe framework
    "data/backups",     # Backups données
    "backend/target",   # Rust workspace target
    ".vscode",          # Editor config
    "coverage"          # Test coverage
]

# Patterns d'exclusion supplémentaires
ignore_patterns = [
    "*.tmp",
    "*.log", 
    "*.cache",
    "*.sqlite",         # DB files
    "*.sqlite-journal",
    "*.pyc",
    "Cargo.lock",
    "package-lock.json"
]

# Plugins personnalisés (chemins relatifs à .vibe/plugins/)
custom_plugins = []

[quality]
# Limites strictes (CRITIQUE - Voir Règle 16 .clinerules)
max_file_lines = 300
# Seuil d'alerte anticipée pendant le développement
file_lines_warning = 250
max_function_lines = 30
max_complexity = 10

# Interdictions ABSOLUES (regex)
# Pattern unwrap: Capture .unwrap() mais PAS unwrap_or/unwrap_or_else
forbidden_patterns = [
    # Frontend
    "console\\.log\\(",
    "console\\.error\\(",
    "console\\.warn\\(",
    "console\\.debug\\(",
    "debugger;?",
    "alert\\(",
    
    # Backend Rust (CRITIQUE)
    "\\.unwrap\\(\\)",           # .unwrap() interdit
    "panic!\\(",                 # panic! interdit
    
    # Général
    "TODO(?!\\()"                # Force format TODO(nom): au lieu de TODO:
]

# Warnings (non-bloquants mais loggés)
warning_patterns = [
    "\\.expect\\(",              # expect() discouragé (utiliser ? ou match)
    ": any",                     # TypeScript any
    "as any",
    "@ts-ignore",
    "Fix.*me",                   # FIXME comments
]

[audit]
# Bloquer le commit si warnings dans audit ?
block_on_warning = false

# Exiger que les tests passent ?
require_tests = true

# Exiger une documentation à jour ?
# Mode solo: pas de documentation de suivi exigée
require_docs = false

# Seuil de sécurité cargo-audit (low, moderate, high)
security_threshold = "high"

# Lancer tests E2E automatiquement en audit ?
# (Désactivé par défaut car E2E peut être long pour trading app)
run_e2e = false

# Vérifier les performances critiques
check_performance = true
max_inference_ms = 200      # Inférence ML max
max_signal_latency_s = 10   # Latence signaux max

[commands]
# Commandes personnalisées (surchargent les plugins par défaut)

# Rust
rust_test_cmd = "cargo test --workspace --all-features"
rust_clippy_cmd = "cargo clippy --workspace --all-features -- -D warnings"
rust_format_cmd = "cargo fmt --all"
rust_check_cmd = "cargo check --workspace --all-features"

# Vue.js / Frontend
vue_test_cmd = "cd frontend && npm run test"
vue_lint_cmd = "cd frontend && npm run lint"
vue_format_cmd = "cd frontend && npm run format"
vue_build_cmd = "cd frontend && npm run build"

# Scripts projet spécifiques
project_test_all = "./scripts/test.sh"
project_audit = "./scripts/validate-phase2.sh"

[overrides]
# Overrides par projet (prennent le dessus sur defaults)

# Autoriser console.log en développement ? 
# FALSE car trading = production-first mindset
allow_console_log = false

# Autoriser unwrap en Rust ? 
# FALSE - JAMAIS dans Native Trading AI (criticité risk management)
allow_unwrap = false

# Seuil de complexité cyclomatique
# 10 est déjà généreux pour code critique trading
max_complexity = 10

# Timeout compilation Rust (secondes)
# Workspace multi-crates peut être long
rust_compile_timeout = 300

# Niveau de log Sentinel (debug, info, warn, error)
log_level = "info"

[trading]
# Section custom pour règles métier trading
# (Utilisée par scripts audit customs si implémentés)

# Performance targets
target_inference_ms = 200
target_signal_latency_s = 10
target_roi_backtest = 0.0      # MVP: >0%, Production: >15%
target_sharpe = 1.5
target_winrate = 55.0          # Pourcentage

# Risk limits (pour validation code risk management)
max_risk_per_trade = 2.0       # Pourcentage capital
max_positions = 3              # Nombre simultané
max_exposure_per_asset = 25.0  # Pourcentage capital
max_drawdown = 20.0            # Pourcentage capital

# Assets supportés (pour validation)
supported_assets = ["BTC", "ETH", "XAUUSD", "XAGUSD"]
supported_timeframes = ["M1", "M5", "M15"]

[notifications]
# Notifications Sentinel (optionnel)
enable_sound = false
enable_desktop = false
enable_slack = false           # Webhook Slack si configuré
slack_webhook_url = ""         # Vide par défaut

[git]
# Paramètres Git pour auto-commit (Phase 3)
auto_commit = false            # Manuel par défaut
commit_format = "conventional" # conventional, simple
require_issue_ref = false      # Exiger référence issue dans commit ?

[performance]
# Limites additionnelles performance
max_db_query_ms = 100          # Requête SQLite max
max_api_response_ms = 5000     # Timeout API externe
max_websocket_reconnect = 10   # Tentatives reconnexion WebSocket

[documentation]
# Exigences documentation
require_function_docs = false  # Mode solo: docs fonctions non obligatoires
require_module_docs = false    # Mode solo: docs modules non obligatoires
docs_language = "fr"           # Langue documentation

[frontend_ui]
# Standards UI globaux pour toutes les apps
dark_mode_required = true
tauri_vue_required = true
collapsible_sidebar_required = true
horizontal_menu_forbidden = true
dropdown_background = "white"
dropdown_text_color = "black"

[experimental]
# Features expérimentales Vibe Framework
ai_suggestions = false         # Suggestions IA code (future)
auto_refactor = false          # Refactoring auto (future)
smart_imports = false          # Import management intelligent (future)
