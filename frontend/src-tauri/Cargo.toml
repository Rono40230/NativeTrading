[package]
name = "native-trading-ai"
version = "0.1.0"
edition = "2021"
description = "Native Trading AI — Application de trading algorithmique haute fréquence"
authors = ["Native Trading AI Team"]

[lib]
name = "native_trading_ai_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "native-trading-ai"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-build = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
