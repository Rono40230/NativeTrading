    const etat = JSON.parse(document.getElementById('etat-projet').textContent)

       <span>commit <span class="hash">${s.commit}</span></span>

       <span style="margin-left:auto;color:#8b949e">${s.note}</span>`

    const CLS = { positif: 'positif', negatif: 'negatif', neutre: 'neutre' }
    const ETATS = { Officielle: 'b-officielle', Observation: 'b-observation' }
    const PRIO = { 0: ['p0', 'P0 — à toi (immédiat)'], 1: ['p1', 'P1 — prête'], 2: ['p2', 'P2 — programmée'], 3: ['p3', 'P3 — en attente'] }

    let html = ''

    // ── Verticales ──
    html += `<h2>📊 Verticales</h2><div class="grille grille-3">`
    for (const v of etat.verticales) {
      html += `<div class="carte verticale" style="border-top: 3px solid ${v.couleur}">
        <div class="tete">
          <span style="font-size:1.4rem">${v.icone}</span>
          <span class="nom">${v.nom}</span>
          <span class="badge ${ETATS[v.etat] ?? 'b-observation'}">${v.etat}</span>
        </div>
        <div class="kpis">${v.kpis.map(k =>
          `<div class="kpi"><div class="v ${CLS[k.classe] ?? 'neutre'}">${k.valeur}</div><div class="l">${k.label}</div></div>`).join('')}
        </div>
        <div class="meta"><strong>Moteur :</strong> ${v.moteur}</div>
        <div class="meta"><strong>IA :</strong> ${v.ia}</div>
        <div class="meta"><strong>Prochaine étape :</strong> ${v.prochaine}</div>
      </div>`
    }
    html += `</div>`

    // ── Feuille de route ──
    const n = etat.feuille_de_route.length
    html += `<h2>🗺️ Feuille de route <span class="meta">${n} actions</span></h2><div class="grille grille-2">`
    for (const a of etat.feuille_de_route) {
      const [cls, lbl] = PRIO[a.prio]
      html += `<div class="carte action">
        <span class="num">${a.id}</span>
        <div>
          <div class="titre">${a.titre}<span class="puce ${cls}">${lbl}</span></div>
          <div class="detail">${a.detail}</div>
          <div class="meta">⏱ ${a.echeance}</div>
        </div>
      </div>`
    }
    html += `</div>`

    // ── Décisions propriétaire ──
    html += `<h2>⚖️ Décisions propriétaire</h2><div class="grille grille-2">`
    for (const d of etat.decisions) {
      html += `<div class="carte decision">
        <div class="date">${d.date}</div>
        <div class="titre" style="font-weight:700;font-size:.9rem">${d.titre}</div>
        <div class="detail" style="font-size:.82rem;color:#adbac7">${d.detail}</div>
      </div>`
    }
    html += `</div>`

    // ── Règles transverses ──
    html += `<h2>🧱 Règles transverses (non négociables)</h2><div class="carte regle"><table>
      <tr><th style="width:220px">Règle</th><th>Détail</th></tr>`
    for (const r of etat.regles_transverses) {
      html += `<tr><td><strong>${r.titre}</strong></td><td>${r.detail}</td></tr>`
    }
    html += `</table></div>`

    // ── Garde-fous de codage ──
    html += `<h2>🔒 Garde-fous de codage</h2>
      <div class="note" style="margin:-4px 0 10px">Qui garantit quoi : <span class="garanti g-hook">hook</span> = contrôlé mécaniquement à chaque commit/push (impossible à outrer) · <span class="garanti g-conv">convention</span> = engagement mutuel, vérifié à chaque chantier. Modification de ces règles = décision propriétaire, sync cockpit obligatoire.</div>
      <div class="carte regle"><table>
      <tr><th style="width:250px">Règle</th><th>Détail</th><th style="width:110px">Garant</th></tr>`
    for (const g of etat.garde_fous_codage) {
      html += `<tr><td><strong>${g.titre}</strong></td><td>${g.detail}</td>
        <td><span class="garanti ${g.garant === 'hook' ? 'g-hook' : 'g-conv'}">${g.garant === 'hook' ? 'hook pre-commit' : 'convention'}</span></td></tr>`
    }
    html += `</table></div>`

    document.getElementById('contenu').innerHTML = html
  })()
