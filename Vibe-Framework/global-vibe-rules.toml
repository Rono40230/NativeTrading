# Global Vibe rules template (reusable across projects)
# User-validated preferences

[ui]
dark_mode_required = true
collapsible_sidebar_required = true
horizontal_menu_forbidden = true
dropdown_background = "white"
dropdown_text_color = "black"

[stack]
frontend_required = "vue"
shell_required = "tauri"

[code_style]
naming_language = "agnostic"

[quality]
file_lines_warning = 250
max_file_lines = 300
check_file_size_during_dev = true

[workflow]
solo_mode_no_tracking_docs = true
allow_minimal_inline_comments_only = true
