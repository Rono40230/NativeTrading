[workspace]
members = [
    "crates/api",
    "crates/backtest",
    "crates/data",
    "crates/ml",
    "crates/indicators",
    "crates/smc",
    "crates/strategies",
    "crates/risk",
    "crates/db",
    "crates/common",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.70"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.20"
futures-util = "0.3"
actix-web = "4"
actix-rt = "2"
actix-cors = "0.7"
actix-ws = "0.2"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-native-tls", "migrate", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
ndarray = "0.15"
polars = { version = "0.35", features = ["lazy", "parquet"] }
ta = "0.5"
chrono = { version = "0.4", features = ["serde"] }
statrs = "0.16"
aes-gcm = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
config = "0.13"
dotenvy = "0.15"
rayon = "1.7"
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
smartcore = { version = "0.4", features = ["serde"] }
ts-rs = { version = "12", features = ["chrono-impl", "uuid-impl"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
strip = true
